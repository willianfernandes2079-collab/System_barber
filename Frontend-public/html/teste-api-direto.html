<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Teste direto API Barbeiros</title>
</head>
<body>

<h2>Teste direto dos barbeiros</h2>

<pre id="resultado">Testando...</pre>

<script src="../js/api.js"></script>

<script>
async function testar() {
  const resultado = document.getElementById("resultado");

  try {
    resultado.textContent = "1. api.js carregado\n2. Chamando /barbeiros...";

    const resposta = await api.get("/barbeiros?ativo=true");

    resultado.textContent =
      "SUCESSO!\n\n" +
      JSON.stringify(resposta, null, 2);

  } catch (erro) {
    resultado.textContent =
      "ERRO!\n\n" +
      "Mensagem: " + (erro?.message || erro) +
      "\n\nStatus: " + (erro?.status || "não informado") +
      "\n\nDados: " + JSON.stringify(erro?.data || null, null, 2);
  }
}

testar();
</script>

</body>
</html>
