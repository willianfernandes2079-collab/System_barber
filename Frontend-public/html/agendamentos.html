<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Agendamentos - System Barber</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/agendamentos.css" />

    <style>
      #cliente {
        position: relative;
      }

      #clienteBusca {
        width: 100%;
      }

      #clientesResultados {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        z-index: 10;
        max-height: 220px;
        overflow-y: auto;
        background: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        box-shadow: var(--shadow-md);
      }

      .cliente-resultado {
        padding: 12px 14px;
        cursor: pointer;
        border-bottom: 1px solid var(--color-border);
      }

      .cliente-resultado:hover {
        background: var(--color-accent-soft);
      }

      .cliente-resultado-nome {
        display: block;
        font-weight: 600;
        color: var(--color-text-heading);
      }

      .cliente-resultado-telefone {
        display: block;
        margin-top: 3px;
        font-size: 0.85rem;
        color: var(--color-text-muted);
      }

      #plano {
        margin-top: 16px;
      }

      #planoTipo {
        display: flex;
        gap: 16px;
        margin-top: 8px;
      }

      #planoSelect {
        width: 100%;
        margin-top: 10px;
      }

      #planoInfo {
        margin-top: 8px;
        font-size: 0.9rem;
        color: var(--color-text-muted);
      }
    </style>
  </head>

  <body>
    <form id="agendamentoForm">
      <div id="cliente">
        <label for="clienteBusca">Cliente</label>

        <input
          type="text"
          id="clienteBusca"
          placeholder="Digite o nome do cliente"
          autocomplete="off"
          required
        />

        <input type="hidden" id="clienteSelect" name="cliente" />

        <div id="clientesResultados"></div>
      </div>

      <div id="plano">
        <label>Tipo de atendimento</label>

        <div id="planoTipo">
          <label>
            <input type="radio" name="tipoAtendimento" value="AVULSO" checked />
            Avulso
          </label>

          <label>
            <input
              type="radio"
              name="tipoAtendimento"
              value="PLANO"
              id="tipoPlano"
              disabled
            />
            Usar plano
          </label>
        </div>

        <select id="planoSelect" disabled>
          <option value="">Selecione um plano</option>
        </select>

        <div id="planoInfo"></div>
      </div>

      <div id="barbeiro">
        <label for="barbeiroSelect">Barbeiro</label>

        <select id="barbeiroSelect" name="barbeiro" required>
          <option value="">Selecione o barbeiro</option>
        </select>
      </div>

      <div id="servico">
        <label for="servicoSelect">Serviço</label>

        <select id="servicoSelect" name="servico" required>
          <option value="">Selecione o serviço</option>
        </select>
      </div>

      <div id="semana">
        <label for="semanaSelect">Semana</label>

        <select id="semanaSelect" required>
          <option value="atual">Esta semana</option>
          <option value="proxima">Próxima semana</option>
        </select>
      </div>

      <div id="dia">
        <label for="diaSelect">Dia</label>

        <select id="diaSelect" required></select>
      </div>

      <div id="horario">
        <label for="horarioInput">Horário</label>

        <select id="horarioInput" name="horario" required disabled>
          <option value="">Selecione primeiro barbeiro, serviço e dia</option>
        </select>
      </div>

      <div id="valor">
        <label for="valorInput">Valor</label>

        <input
          type="number"
          name="valor"
          id="valorInput"
          placeholder="Valor"
          step="0.01"
          min="0"
          required
        />
      </div>

      <div id="status">
        <label for="statusSelect">Status</label>

        <select name="status" id="statusSelect">
          <option value="AGENDADO">Confirmado</option>
          <option value="PENDENTE">Pendente</option>
          <option value="CANCELADO">Cancelado</option>
        </select>
      </div>

      <div id="observacao">
        <label for="observacaoInput">Observação</label>

        <textarea
          name="observacao"
          id="observacaoInput"
          placeholder="Observação"
        ></textarea>
      </div>

      <div id="mensagem"></div>

      <div id="btnSalvar">
        <button type="submit">Salvar agendamento</button>
      </div>

      <div id="btnVolta">
        <button type="button" onclick="window.location.href = 'index.html'">
          Voltar
        </button>
      </div>
    </form>

    <script src="../js/api.js"></script>
    <script src="../js/agendamentos.js"></script>
  </body>
</html>
