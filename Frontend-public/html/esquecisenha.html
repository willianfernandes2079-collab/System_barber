<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Esqueci minha senha - Sistema Barbearia</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/style.login.css" />
  </head>

  <body>
    <div class="login-wrapper">
      <div
        class="login-card"
        style="grid-template-columns: 1fr; max-width: 480px; margin: 0 auto"
      >
        <div id="title" style="grid-column: 1; padding-top: 56px">
          <h1>Esqueci minha senha</h1>
        </div>

        <div id="subtitle" style="grid-column: 1">
          <h2>
            Informe seu e-mail e enviaremos um link para redefinir sua senha.
          </h2>
        </div>

        <form
          class="login-form"
          id="formEsqueciSenha"
          style="grid-column: 1; grid-template-columns: 1fr"
        >
          <div id="usuario">
            <label for="emailInput">E-mail</label>
          </div>

          <div id="texto">
            <input
              type="email"
              id="emailInput"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div
            id="mensagemResultado"
            class="alert alert-success"
            style="display: none; margin-bottom: 18px"
          ></div>

          <div id="btnEntrar">
            <button type="submit">Enviar link de recuperação</button>
          </div>
        </form>

        <div id="ou" style="grid-column: 1">
          <label>ou</label>
        </div>

        <div style="grid-column: 1; text-align: center; padding-bottom: 48px">
          <a href="login.html"> Voltar para o login </a>
        </div>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/esqueci-senha.js"></script>
  </body>
</html>
