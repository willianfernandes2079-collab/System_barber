<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Caixa - Sistema Barbearia</title>

    <link rel="stylesheet" href="../css/global.css" />

    <link rel="stylesheet" href="../css/app-shell.css" />

    <link rel="stylesheet" href="../css/caixa.css" />
  </head>

  <body>
    <div id="app-sidebar"></div>

    <header id="app-topbar"></header>

    <main class="app-main caixa-page">
      <main class="caixa-main">
        <section class="catalog-section">
          <div class="catalog-controls">
            <div class="search-bar">
              <input
                type="text"
                id="input-busca"
                placeholder="Buscar serviço ou produto..."
                oninput="filtrarItens()"
              />
            </div>

            <div class="category-tabs">
              <button
                type="button"
                class="tab-btn active"
                onclick="filtrarCategoria('todos')"
              >
                Todos
              </button>

              <button
                type="button"
                class="tab-btn"
                onclick="filtrarCategoria('servicos')"
              >
                Serviços
              </button>

              <button
                type="button"
                class="tab-btn"
                onclick="filtrarCategoria('produtos')"
              >
                Produtos
              </button>

              <button
                type="button"
                class="tab-btn"
                onclick="filtrarCategoria('bebidas')"
              >
                Bebidas
              </button>
            </div>
          </div>

          <div class="products-grid" id="grid-produtos"></div>
        </section>

        <section class="checkout-section">
          <div class="checkout-header">
            <span class="checkout-title"> Comanda Atual </span>

            <span id="comanda-numero"> #0042 </span>
          </div>

          <div class="cart-list-container">
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Item</th>
                  <th style="width: 70px">Qtd</th>
                  <th>Preço</th>
                  <th style="width: 30px"></th>
                </tr>
              </thead>

              <tbody id="cart-tbody"></tbody>
            </table>
          </div>

          <div class="payment-form">
            <div class="form-group">
              <label for="cliente-nome"> Cliente / Profissional </label>

              <input
                type="text"
                id="cliente-nome"
                class="form-control"
                placeholder="Nome do cliente (Opcional)"
              />
            </div>

            <div class="form-group">
              <label for="forma-pagamento"> Forma de Pagamento </label>

              <select
                id="forma-pagamento"
                class="form-control"
                onchange="alternarCamposPagamento()"
              >
                <option value="dinheiro">Dinheiro</option>

                <option value="pix">PIX</option>

                <option value="debito">Cartão de Débito</option>

                <option value="credito">Cartão de Crédito</option>

                <option value="plano">Plano / Assinatura</option>
              </select>
            </div>

            <div class="form-group" id="grupo-dinheiro">
              <label for="valor-recebido"> Valor Entregue (R$) </label>

              <input
                type="number"
                id="valor-recebido"
                class="form-control"
                step="0.01"
                placeholder="0,00"
                oninput="calcularCalculosValores()"
              />

              <div class="quick-cash-container">
                <button
                  type="button"
                  class="btn-quick-cash"
                  onclick="aplicarAtalhoDinheiro(20)"
                >
                  R$ 20
                </button>

                <button
                  type="button"
                  class="btn-quick-cash"
                  onclick="aplicarAtalhoDinheiro(50)"
                >
                  R$ 50
                </button>

                <button
                  type="button"
                  class="btn-quick-cash"
                  onclick="aplicarAtalhoDinheiro(100)"
                >
                  R$ 100
                </button>

                <button
                  type="button"
                  class="btn-quick-cash"
                  onclick="aplicarValorExato()"
                >
                  Exato
                </button>
              </div>
            </div>

            <div class="plano-info" id="plano-info">
              <strong>Plano / Assinatura</strong>

              <div class="plano-status">
                <span> Cortes disponíveis: </span>

                <strong id="plano-cortes"> — </strong>
              </div>

              <div class="plano-status">
                <span> Validade: </span>

                <strong id="plano-validade"> — </strong>
              </div>
            </div>

            <div class="summary-box">
              <div class="summary-row">
                <span>Subtotal:</span>

                <span id="subtotal-val"> R$ 0,00 </span>
              </div>

              <div class="summary-row" id="linha-troco">
                <span>Troco:</span>

                <span id="troco-val" class="troco-valido"> R$ 0,00 </span>
              </div>

              <div class="summary-row total-row">
                <span>TOTAL:</span>

                <span id="total-val" class="total-amount"> R$ 0,00 </span>
              </div>
            </div>

            <div class="action-buttons">
              <button
                type="button"
                class="btn btn-danger"
                onclick="limparComanda()"
              >
                Cancelar
              </button>

              <button
                type="button"
                class="btn btn-primary"
                onclick="finalizarVenda()"
              >
                Finalizar
              </button>
            </div>
          </div>
        </section>
      </main>
    </main>

    <div class="modal-overlay" id="modal-recibo">
      <div class="modal-card">
        <div class="receipt-header">
          <strong> BARBEARIA CLUB </strong>

          <br />

          <small> Comprovante de Pagamento </small>
        </div>

        <div class="receipt-body" id="recibo-conteudo"></div>

        <div class="receipt-footer">
          Obrigado pela preferência!<br />
          Volte sempre.
        </div>

        <button
          type="button"
          class="btn btn-primary"
          style="width: 100%; margin-top: 15px"
          onclick="fecharModal()"
        >
          Fechar e Novo Atendimento
        </button>
      </div>
    </div>

    <script src="../js/api.js"></script>

    <script src="../js/layout.js"></script>

    <script src="../js/caixa.js"></script>

    <script>
      inicializarLayout("Caixa");
    </script>
  </body>
</html>
