<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastrar Cliente - System Barber</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/app-shell.css" />
  </head>

  <body>
    <div id="app-sidebar"></div>
    <header id="app-topbar"></header>

    <main class="app-main">
      <div class="page-header">
        <h2 class="stripe-accent">Cadastrar cliente</h2>
      </div>

      <div class="card">
        <form id="formCadastrarCliente">
          <div class="field">
            <label for="nome">Nome</label>

            <input
              type="text"
              id="nome"
              name="nome"
              required
            />
          </div>

          <div class="field">
            <label for="telefone">Telefone</label>

            <input
              type="tel"
              id="telefone"
              name="telefone"
              required
            />
          </div>

          <div class="field">
            <label for="whatsapp">WhatsApp</label>

            <input
              type="tel"
              id="whatsapp"
              name="whatsapp"
            />
          </div>

          <div class="field">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              name="email"
            />
          </div>

          <div class="field">
            <label for="dataNascimento">
              Data de nascimento
            </label>

            <input
              type="date"
              id="dataNascimento"
              name="data_nascimento"
              required
            />
          </div>

          <div class="field">
            <label for="cpf">CPF</label>

            <input
              type="text"
              id="cpf"
              name="cpf"
              inputmode="numeric"
              maxlength="11"
              minlength="11"
              pattern="[0-9]{11}"
              placeholder="Somente números"
              required
            />
          </div>

          <div class="field">
            <label for="observacoes">
              Observações
            </label>

            <textarea
              id="observacoes"
              name="observacoes"
              rows="4"
              placeholder="Ex.: prefere máquina 2 nas laterais"
            ></textarea>
          </div>

          <div
            id="formErro"
            class="alert alert-danger"
            style="display: none; margin-bottom: 16px"
          ></div>

          <div
            class="flex gap-8"
            style="justify-content: flex-end; margin-top: 22px"
          >
            <button
              type="button"
              class="btn btn-ghost"
              id="btnVoltar"
            >
              Voltar
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              id="btnCadastrar"
            >
              Cadastrar cliente
            </button>
          </div>
        </form>
      </div>
    </main>

    <div
      class="toast-container"
      id="toastContainer"
    ></div>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/cadastrarcli.js"></script>

    <script>
      inicializarLayout("Cadastrar cliente");
    </script>
  </body>
</html>
